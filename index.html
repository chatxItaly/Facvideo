<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adesso la gente parcheggia sulla spiaggia</title>

<style>

/* =========================
   BASE
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {

  padding: 25px 12px 80px;

  font-family: Arial, sans-serif;

  color: #ffffff;

  background:
    repeating-linear-gradient(
      -45deg,
      #0755a5 0px,
      #0755a5 18px,
      #0b6bc4 18px,
      #0b6bc4 36px
    );

  background-attachment: fixed;
}


/* =========================
   CONTENITORE
========================= */

.page {

  width: 100%;

  max-width: 700px;

  margin: 0 auto;
}


/* =========================
   TITOLO
========================= */

h1 {

  margin: 10px 0 25px;

  text-align: center;

  font-size: clamp(30px, 8vw, 52px);

  line-height: 1.05;

  text-shadow:
    0 3px 8px rgba(0,0,0,.45);
}


/* =========================
   VIDEO
========================= */

.video-box {

  width: 100%;

  margin: 0 auto 25px;
}

.video-box video {

  display: block;

  width: 100%;

  max-width: 100%;

  border: 5px solid #ffffff;

  border-radius: 14px;

  background: #000000;

  box-shadow:
    0 10px 25px rgba(0,0,0,.45);
}


/* =========================
   COMMENTO + FOTO
========================= */

.commento {

  padding: 22px 18px;

  margin: 20px 0;

  background: rgba(0,35,90,.55);

  border: 4px solid #ffffff;

  border-radius: 14px;

  text-align: center;

  box-shadow:
    0 8px 20px rgba(0,0,0,.35);
}

.commento p {

  margin: 0;

  font-size: clamp(22px, 5vw, 32px);

  line-height: 1.25;

  font-weight: bold;
}

.commento img {

  display: block;

  width: 100%;

  height: auto;

  margin-top: 15px;

  border-radius: 10px;
}


/* 🔴🔴🔴 INIZIO STILE BANNER 🔴🔴🔴 */

.banner-overlay {

  position: fixed;

  inset: 0;

  z-index: 9999;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 15px;

  background: rgba(0,0,0,.65);

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

  transition:
    opacity .3s ease,
    visibility .3s ease;
}

.banner-overlay.show {

  opacity: 1;

  visibility: visible;

  pointer-events: auto;
}


/* =========================
   BANNER
========================= */

.banner {

  position: relative;

  width: 90%;

  max-width: 430px;

  padding: 24px 15px 18px;

  text-align: center;

  background: #064b91;

  border: 4px solid #54ff45;

  border-radius: 16px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.7);
}


/* TITOLO BANNER */

.banner h2 {

  margin: 0 0 10px;

  color: #54ff45;

  font-size: 25px;

  line-height: 1.2;
}


/* TESTO BANNER */

.banner p {

  margin: 0 0 18px;

  color: #ffffff;

  font-size: 17px;

  line-height: 1.4;
}


/* 🔴 LINK DENTRO IL BANNER */

.banner a {

  display: block;

  width: 100%;

  padding: 16px 10px;

  background: #54ff45;

  color: #06305e;

  border-radius: 10px;

  text-decoration: none;

  font-size: 20px;

  font-weight: bold;

  box-shadow:
    0 4px 0 #2fae27;
}

.banner a:active {

  transform: translateY(3px);

  box-shadow: none;
}


/* PULSANTE CHIUSURA */

.close {

  position: absolute;

  top: 2px;

  right: 6px;

  width: 35px;

  height: 35px;

  padding: 0;

  border: none;

  background: transparent;

  color: #ffffff;

  font-size: 28px;

  line-height: 35px;

  cursor: pointer;
}


/* 🔴🔴🔴 FINE STILE BANNER 🔴🔴🔴 */


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

  body {

    padding: 15px 8px 60px;
  }

  .banner {

    width: 92%;

    max-width: 390px;

    padding: 23px 13px 17px;
  }

  .banner h2 {

    font-size: 23px;
  }

  .banner p {

    font-size: 16px;
  }

  .banner a {

    font-size: 19px;

    padding: 16px 8px;
  }

}


/* 🔴🔴🔴 FINE CSS 🔴🔴🔴 */

</style>

</head>


<body>


<div class="page">


  <!-- =========================
       TITOLO
  ========================== -->

  <h1>
    Adesso la gente parcheggia sulla spiaggia
  </h1>


  <!-- =========================
       VIDEO
  ========================== -->

  <div class="video-box">

    <video
      controls
      playsinline
      preload="metadata"
    >

      <source
        src="video.mp4"
        type="video/mp4"
      >

      Il tuo browser non supporta la riproduzione del video.

    </video>

  </div>


  <!-- =========================
       COMMENTO + FOTO
  ========================== -->

  <div class="commento">

    <p>
      Effetto strisce blù 👮‍♀️
    </p>

    <img
      src="foto.jpg"
      alt="Effetto strisce blu"
    >

  </div>


</div>


<!-- 🔴🔴🔴 INIZIO CODICE BANNER 🔴🔴🔴 -->

<div
  class="banner-overlay"
  id="banner"
>

  <div class="banner">


    <!-- CHIUDI -->

    <button
      class="close"
      onclick="chiudiBanner()"
      aria-label="Chiudi banner"
    >
      ×
    </button>


    <!-- TITOLO -->

    <h2>
      🇮🇹 Visita le Chat Italiane 🇮🇹
    </h2>


    <!-- TESTO -->

    <p>
      Entra nella chat e fai due chiacchiere.
    </p>


    <!-- 🟢 LINK DIRETTAMENTE NEL BANNER -->

    <a
      href="https://unox1chat.netlify.app/"
      target="_blank"
      rel="noopener noreferrer"
    >
      APRI LA CHAT
    </a>


  </div>

</div>

<!-- 🔴🔴🔴 FINE CODICE BANNER 🔴🔴🔴 -->


<!-- 🔴🔴🔴 INIZIO CONTROLLO ULTIMI 5 SECONDI 🔴🔴🔴 -->

<script>

const video =
  document.querySelector(".video-box video");

const banner =
  document.getElementById("banner");

let bannerChiuso = false;


/* CONTROLLA IL TEMPO DEL VIDEO */

video.addEventListener("timeupdate", function() {

  if (!isFinite(video.duration)) {
    return;
  }

  const tempoRimanente =
    video.duration - video.currentTime;


  /*
    MOSTRA IL BANNER
    QUANDO MANCANO 5 SECONDI
  */

  if (
    tempoRimanente <= 5 &&
    tempoRimanente > 0 &&
    !bannerChiuso
  ) {

    banner.classList.add("show");

  }

});


/* CHIUDI BANNER */

function chiudiBanner() {

  banner.classList.remove("show");

  bannerChiuso = true;

}

</script>

<!-- 🔴🔴🔴 FINE CONTROLLO ULTIMI 5 SECONDI 🔴🔴🔴 -->


</body>
</html>
