<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adesso la gente parcheggia sulla spiaggia</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {

  margin: 0;

  padding: 25px 12px 80px;

  font-family: Arial, sans-serif;

  color: #ffffff;

  background:

    repeating-linear-gradient(
      -45deg,
      #0755a5 0px,
      #0755a5 18px,
      #0b6bc4 18px,
      #0b6bc4 36px
    );

  background-attachment: fixed;
}


/* CONTENITORE */

.page {

  width: 100%;

  max-width: 700px;

  margin: 0 auto;
}


/* TITOLO */

h1 {

  margin: 10px 0 25px;

  text-align: center;

  font-size: clamp(30px, 8vw, 52px);

  line-height: 1.05;

  text-shadow:
    0 3px 8px rgba(0,0,0,.45);
}


/* VIDEO */

.video-box {

  width: 100%;

  margin: 0 auto 25px;
}

.video-box video {

  display: block;

  width: 100%;

  max-width: 100%;

  border: 5px solid #ffffff;

  border-radius: 14px;

  background: #000000;

  box-shadow:
    0 10px 25px rgba(0,0,0,.45);
}


/* COMMENTO */

.commento {

  padding: 22px 18px;

  margin: 20px 0;

  background: rgba(0,35,90,.55);

  border: 4px solid #ffffff;

  border-radius: 14px;

  text-align: center;

  box-shadow:
    0 8px 20px rgba(0,0,0,.35);
}

.commento p {

  margin: 0;

  font-size: clamp(22px, 5vw, 32px);

  line-height: 1.25;

  font-weight: bold;
}




./* 🔴🔴🔴 DIMENSIONE BANNER 🔴🔴🔴 */

.banner {

  position: relative;

  width: 90%;

  max-width: 430px;

  padding: 22px 15px 18px;

  text-align: center;

  background: #064b91;

  border: 4px solid #54ff45;

  border-radius: 16px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.7);
}
/* 🔴🔴🔴 FINE STILE BANNER 🔴🔴🔴 */


/* MOBILE */

@media (max-width: 480px) {

  body {

    padding: 15px 8px 60px;
  }

  .banner h2 {

    font-size: 25px;
  }

  .banner a {

    font-size: 20px;

    padding: 18px 8px;
  }
}

</style>

</head>


<body>


<div class="page">


<h1>
  Adesso la gente parcheggia sulla spiaggia
</h1>


<!-- VIDEO -->

<div class="video-box">

  <video
    controls
    playsinline
    preload="metadata"
  >

    <source
      src="video.mp4"
      type="video/mp4"
    >

    Il tuo browser non supporta la riproduzione del video.

  </video>

</div>


<!-- COMMENTO -->

<div class="commento">

  <p>
    Effetto strisce blù 👮‍♀️
  </p>

  <img
    src="foto.jpg"
    alt="Effetto strisce blu"
    style="width:100%; max-width:100%; margin-top:15px; border-radius:10px; display:block;"
  >

</div>
<!-- 🔴🔴🔴 INIZIO CODICE BANNER 🔴🔴🔴 -->

<div
  class="banner-overlay"
  id="banner"
>

  <div class="banner">

  <button
    class="close"
    onclick="chiudiBanner()"
    aria-label="Chiudi"
  >
    ×
  </button>

  <h2>
    🇮🇹 Visita le Chat Italiane 🇮🇹
  </h2>

  <p>
    Entra nella chat e fai due chiacchiere.
  </p>

  <!-- 🟢 LINK DENTRO IL BANNER 🟢 -->
  <a
    href="https://unox1chat.netlify.app/"
    target="_blank"
    rel="noopener noreferrer"
  >
    APRI LA CHAT
  </a>

</div>
<!-- 🔴🔴🔴 FINE CODICE BANNER 🔴🔴🔴 -->


<!-- 🔴🔴🔴 INIZIO BANNER ULTIMI 5 SECONDI VIDEO 🔴🔴🔴 -->

<script>

const video = document.querySelector(".video-box video");
const banner = document.getElementById("banner");

let bannerChiuso = false;

video.addEventListener("timeupdate", function() {

  const tempoRimanente = video.duration - video.currentTime;

  if (
    tempoRimanente <= 5 &&
    tempoRimanente > 0 &&
    !bannerChiuso
  ) {

    banner.classList.add("show");

  }

});


function chiudiBanner() {

  banner.classList.remove("show");

  bannerChiuso = true;

}

</script>

<!-- 🔴🔴🔴 FINE BANNER ULTIMI 5 SECONDI VIDEO 🔴🔴🔴 -->



</body>
</html>
